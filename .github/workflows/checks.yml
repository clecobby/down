# Every push and pull request, on every branch: backend tests, website build, mobile lint.
# Deploys are done by AWS CodePipeline, not here: down-prod (main) and down-dev (dev), see deploy/buildspec.yml.
name: checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Backend tests
        working-directory: backend
        run: npm ci --no-audit --no-fund && npm test
      - name: Website build
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Mobile lint
        working-directory: mobile
        run: npm ci --no-audit --no-fund && npm run lint
