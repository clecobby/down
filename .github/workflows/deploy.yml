# Every push and pull request: run the backend tests, build the website, lint the mobile app.
# Push to main → deploy production (https://d2lfawokdyd1nt.cloudfront.net)
# Push to dev  → deploy dev        (https://d3nrslazsd4mxv.cloudfront.net)
# Any other branch (e.g. clecobby) → checks only.
#
# AWS access uses GitHub's OIDC login: no AWS keys are stored in GitHub. The role
# down-deploy-prod only trusts this repo's main branch; down-deploy-dev only trusts dev.
# The mobile app is published as an over-the-air update (EAS Update) when the EXPO_TOKEN
# repository secret is set.
name: test & deploy

on:
  push:
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Backend tests
        working-directory: backend
        run: npm ci --no-audit --no-fund && npm test
      - name: Website build
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Mobile lint
        working-directory: mobile
        run: npm ci --no-audit --no-fund && npm run lint

  deploy:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job log into AWS via OIDC
      contents: read
    env:
      STAGE: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      CHANNEL: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      API_URL: ${{ github.ref == 'refs/heads/main' && 'https://d2lfawokdyd1nt.cloudfront.net' || 'https://d3nrslazsd4mxv.cloudfront.net' }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::504886488640:role/down-deploy-${{ env.STAGE }}
          aws-region: us-east-1
      - name: Install website dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Deploy API + website
        run: bash deploy/deploy-aws.sh "$STAGE"
      - name: Publish mobile update
        if: env.EXPO_TOKEN != ''
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ env.API_URL }}
        run: |
          npm ci --no-audit --no-fund
          npx --yes eas-cli@latest update --channel "$CHANNEL" --message "$(git log -1 --pretty=%s)" --non-interactive
